<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction Model</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Vibrant gradient background to highlight the glass effect */
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            padding: 20px;
        }

        /* Glassmorphism styling */
        .glass-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            padding: 40px;
            width: 100%;
            max-width: 600px;
            color: #fff;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 14px;
            margin-bottom: 6px;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        input {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px;
            border-radius: 8px;
            color: #fff;
            outline: none;
            transition: 0.3s ease;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.35);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 8px rgba(255,255,255,0.2);
        }

        .btn-predict {
            grid-column: span 2;
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-predict:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-2px);
        }

        .result-box {
            grid-column: span 2;
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            min-height: 24px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        .footer {
            grid-column: span 2;
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding-top: 20px;
        }

        .footer a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
            font-weight: 600;
            transition: color 0.3s;
        }

        .footer a:hover {
            color: #ffecd2;
            text-decoration: underline;
        }

        @media (max-width: 500px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .btn-predict, .result-box, .footer {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<div class="glass-container">
    <h2>Diabetes Risk Predictor</h2>
    <form id="predictionForm" class="form-grid">
        <div class="input-group">
            <label>Pregnancies</label>
            <input type="number" id="Pregnancies" required placeholder="e.g. 2">
        </div>
        <div class="input-group">
            <label>Glucose</label>
            <input type="number" id="Glucose" required placeholder="e.g. 120">
        </div>
        <div class="input-group">
            <label>Blood Pressure</label>
            <input type="number" id="BloodPressure" required placeholder="e.g. 70">
        </div>
        <div class="input-group">
            <label>Skin Thickness</label>
            <input type="number" id="SkinThickness" required placeholder="e.g. 20">
        </div>
        <div class="input-group">
            <label>Insulin</label>
            <input type="number" id="Insulin" required placeholder="e.g. 85">
        </div>
        <div class="input-group">
            <label>BMI</label>
            <input type="number" step="0.1" id="BMI" required placeholder="e.g. 25.5">
        </div>
        <div class="input-group">
            <label>Pedigree Function</label>
            <input type="number" step="0.001" id="DiabetesPedigreeFunction" required placeholder="e.g. 0.45">
        </div>
        <div class="input-group">
            <label>Age</label>
            <input type="number" id="Age" required placeholder="e.g. 33">
        </div>

        <button type="submit" class="btn-predict">Run Prediction</button>

        <div class="result-box" id="resultText"></div>
        
        <div class="footer">
            <p>Developed by <strong>[YOUR NAME]</strong></p>
            <p style="margin-top: 10px;">
                <a href="[YOUR LINKEDIN URL]" target="_blank">LinkedIn</a> | 
                <a href="[YOUR GITHUB URL]" target="_blank">GitHub</a>
            </p>
        </div>
    </form>
</div>

<script>
    document.getElementById('predictionForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const resultText = document.getElementById('resultText');
        resultText.innerText = "Analyzing patient data...";
        resultText.style.color = "#fff";

        // Collect parameters
        const data = {
            Pregnancies: parseFloat(document.getElementById('Pregnancies').value),
            Glucose: parseFloat(document.getElementById('Glucose').value),
            BloodPressure: parseFloat(document.getElementById('BloodPressure').value),
            SkinThickness: parseFloat(document.getElementById('SkinThickness').value),
            Insulin: parseFloat(document.getElementById('Insulin').value),
            BMI: parseFloat(document.getElementById('BMI').value),
            DiabetesPedigreeFunction: parseFloat(document.getElementById('DiabetesPedigreeFunction').value),
            Age: parseFloat(document.getElementById('Age').value)
        };

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (result.error) {
                resultText.innerText = "Error processing prediction.";
            } else {
                if (result.prediction === 1) {
                    resultText.innerText = "High Risk of Diabetes";
                    resultText.style.color = "#ff9ff3"; // Soft pink/red for alert
                } else {
                    resultText.innerText = "Low Risk of Diabetes";
                    resultText.style.color = "#a1f2c2"; // Soft green for clear
                }
            }
        } catch (error) {
            resultText.innerText = "Failed to connect to the prediction API.";
        }
    });
</script>

</body>
</html>
