<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction Model</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #1e293b;
            --text-light: #334155;
            --success: #065f46;
            --success-bg: rgba(167, 243, 208, 0.8);
            --danger: #991b1b;
            --danger-bg: rgba(254, 202, 202, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            padding: 2.5rem;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #111827;
            text-shadow: 0 2px 4px rgba(255,255,255,0.3);
        }

        p.subtitle {
            text-align: center;
            color: #1f2937;
            margin-bottom: 2rem;
            font-size: 0.95rem;
            font-weight: 500;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.875rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: #111827;
            text-shadow: 0 1px 2px rgba(255,255,255,0.5);
        }

        input {
            padding: 0.75rem;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            font-size: 1rem;
            color: #000;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
        }

        input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.8);
            border-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.4);
        }

        button {
            grid-column: span 2;
            background: rgba(17, 24, 39, 0.9);
            color: white;
            padding: 0.875rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        button:hover {
            background: rgba(0, 0, 0, 1);
            transform: translateY(-2px);
        }

        button:disabled {
            background: rgba(17, 24, 39, 0.5);
            cursor: not-allowed;
            transform: none;
        }

        #resultBox {
            grid-column: span 2;
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            display: none;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .diabetic { background-color: var(--danger-bg); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.4); }
        .non-diabetic { background-color: var(--success-bg); color: var(--success); border: 1px solid rgba(16, 185, 129, 0.4); }
        .error { background-color: rgba(255,255,255,0.7); color: #475569; border: 1px solid rgba(255,255,255,0.5); }

        footer {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding: 1.5rem;
            text-align: center;
        }

        footer p {
            color: #111827;
            font-size: 0.95rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        /* New Efficient Glass Social Buttons */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.2rem;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            color: #1e293b;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: translateY(-2px);
            color: #000;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .social-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        @media (max-width: 600px) {
            form { grid-template-columns: 1fr; }
            button, #resultBox { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <main>
        <div class="card">
            <h1>Diabetes Risk Predictor</h1>
            <p class="subtitle">Enter patient health metrics to get an ML-powered assessment</p>

            <form id="predictionForm">
                <div class="input-group">
                    <label for="Pregnancies">Pregnancies</label>
                    <input type="number" id="Pregnancies" required min="0" value="1">
                </div>
                <div class="input-group">
                    <label for="Glucose">Glucose Level</label>
                    <input type="number" step="0.1" id="Glucose" required value="85">
                </div>
                <div class="input-group">
                    <label for="BloodPressure">Blood Pressure</label>
                    <input type="number" step="0.1" id="BloodPressure" required value="66">
                </div>
                <div class="input-group">
                    <label for="SkinThickness">Skin Thickness</label>
                    <input type="number" step="0.1" id="SkinThickness" required value="29">
                </div>
                <div class="input-group">
                    <label for="Insulin">Insulin Level</label>
                    <input type="number" step="0.1" id="Insulin" required value="0">
                </div>
                <div class="input-group">
                    <label for="BMI">BMI</label>
                    <input type="number" step="0.1" id="BMI" required value="26.6">
                </div>
                <div class="input-group">
                    <label for="DiabetesPedigreeFunction">Pedigree Function</label>
                    <input type="number" step="0.001" id="DiabetesPedigreeFunction" required value="0.351">
                </div>
                <div class="input-group">
                    <label for="Age">Age</label>
                    <input type="number" id="Age" required min="1" value="31">
                </div>

                <button type="submit" id="submitBtn">Predict Status</button>
                <div id="resultBox"></div>
            </form>
        </div>
    </main>

    <footer>
        <p>Developed & Designed by <strong>T.Omkar</strong></p>
        <div class="social-links">
            <a href="https://github.com/Tomkar527" target="_blank" rel="noopener noreferrer" class="social-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                GitHub
            </a>
            
            <a href="https://www.linkedin.com/in/t-omkar-025383382?utm_source=share_via&utm_content=profile&utm_medium=member_android" target="_blank" rel="noopener noreferrer" class="social-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
                </svg>
                LinkedIn
            </a>
        </div>
    </footer>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const btn = document.getElementById('submitBtn');
            const resultBox = document.getElementById('resultBox');
            
            btn.disabled = true;
            btn.innerText = 'Analyzing...';
            resultBox.style.display = 'none';
            resultBox.className = '';

            const payload = {
                Pregnancies: parseInt(document.getElementById('Pregnancies').value),
                Glucose: parseFloat(document.getElementById('Glucose').value),
                BloodPressure: parseFloat(document.getElementById('BloodPressure').value),
                SkinThickness: parseFloat(document.getElementById('SkinThickness').value),
                Insulin: parseFloat(document.getElementById('Insulin').value),
                BMI: parseFloat(document.getElementById('BMI').value),
                DiabetesPedigreeFunction: parseFloat(document.getElementById('DiabetesPedigreeFunction').value),
                Age: parseInt(document.getElementById('Age').value)
            };

            try {
                const response = await fetch('http://127.0.0.1:8000/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();

                resultBox.style.display = 'block';
                if (data.status === 'Diabetic') {
                    resultBox.textContent = '⚠️ Assessment: High Risk (Diabetic)';
                    resultBox.classList.add('diabetic');
                } else {
                    resultBox.textContent = '✅ Assessment: Low Risk (Non-Diabetic)';
                    resultBox.classList.add('non-diabetic');
                }

            } catch (error) {
                console.error('Error:', error);
                resultBox.style.display = 'block';
                resultBox.textContent = 'Error: Cannot connect to the API. Is your FastAPI server running?';
                resultBox.classList.add('error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Predict Status';
            }
        });
    </script>
</body>
</html>
